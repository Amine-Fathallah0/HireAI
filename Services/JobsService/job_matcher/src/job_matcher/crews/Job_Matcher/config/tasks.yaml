job_scraper_task:
  agent: job_scraper_agent
  description: >
    CRITICAL: You are given pre-scraped webpage content below. Your job is to extract 
    job posting information from this EXACT content.
    
    DO NOT use any tools.
    DO NOT scrape anything.
    DO NOT make up information.
    ONLY extract what you can clearly see in the content below.
    
    === SCRAPED CONTENT START ===
    {scraped_content}
    === SCRAPED CONTENT END ===
    
    Read the content above carefully and extract:
    1. Job title (the EXACT title as written)
    2. Company name (the EXACT company name)
    3. Location (city, state, country, or "Remote")
    4. Complete job description
    5. ALL requirements/qualifications mentioned
    6. ALL responsibilities listed
    7. ALL required technical skills
    8. ALL preferred/nice-to-have skills
    9. Experience level (entry/junior/mid/senior/lead)
    10. Salary/compensation if mentioned
    11. Employment type (full-time/part-time/contract/etc)
    
    Be thorough - extract ALL skills mentioned, not just a few examples.
    
  expected_output: >
    Return ONLY valid JSON (no markdown, no extra text). Extract REAL values from the scraped content:
    {
      "job_id": "UUID",
      "title": "Extract EXACT job title from content",
      "company": "Extract EXACT company name from content",
      "location": "Extract location from content",
      "description": "Extract full job description text",
      "requirements": ["Extract ALL requirements as separate items"],
      "qualifications": ["Extract ALL qualifications"],
      "responsibilities": ["Extract ALL responsibilities"],
      "required_skills": ["Extract ALL required technical skills mentioned"],
      "preferred_skills": ["Extract ALL preferred/nice-to-have skills"],
      "experience_level": "entry, junior, mid, senior, or lead",
      "salary_range": "Extract salary if mentioned, otherwise 'Not specified'",
      "employment_type": "Extract type: full-time, part-time, contract, etc",
      "application_url": "{job_url}",
      "posted_date": "Extract date if visible, otherwise 'Not specified'",
      "source_platform": "indeed, linkedin, glassdoor, or other"
    }

job_matching_task:
  agent: job_matching_agent
  description: >
    You are analyzing a job match between a candidate's CV and a job posting.
    
    === ACTUAL CANDIDATE DATA ===
    {candidate_cv_data}
    
    === ACTUAL JOB POSTING ===
    {scraped_job_details}
    
    TASK REQUIREMENTS:
    1. Calculate match scores based on ONLY the data shown above
    2. Compare CV skills list with job required_skills list
    3. Identify which skills appear in BOTH lists (matching_skills)
    4. Identify which job skills are NOT in the CV (missing_skills)
    5. Calculate percentage-based scores using the formulas below
    
    CALCULATION FORMULAS:
    - skills_match = (number of matching skills / total required skills) × 100
    - experience_match = Compare CV experience years/level vs job requirements (0-100)
    - qualifications_match = Compare CV education/certs vs job requirements (0-100)
    - culture_fit = Subjective assessment based on CV tone vs job description (0-100)
    - overall_match_score = (skills_match × 0.4) + (experience_match × 0.3) + (qualifications_match × 0.2) + (culture_fit × 0.1)
    
    CRITICAL RULES:
    - If CV has zero matching skills → matching_skills = []
    - If CV has all required skills → missing_skills = []
    - Do NOT invent skills not in the provided data
    - Do NOT use example values like "Java", "Python", "ABC Corporation"
    - Use ONLY skills and details from the actual data above
    
  expected_output: >
    Return ONLY a valid JSON object (no markdown, no backticks, no "```json").
    
    Structure:
    {
      "overall_match_score": <number 0-100>,
      "score_breakdown": {
        "skills_match": <number 0-100>,
        "experience_match": <number 0-100>,
        "qualifications_match": <number 0-100>,
        "culture_fit": <number 0-100>
      },
      "matching_skills": [
        {
          "skill": "<actual skill name from BOTH CV and job>",
          "candidate_level": "<level from CV>",
          "required_level": "<level from job>"
        }
      ],
      "missing_skills": [
        {
          "skill": "<actual skill from job NOT in CV>",
          "importance": "required or preferred",
          "impact_on_score": <negative number>
        }
      ],
      "detailed_reasoning": "<explain the match score using actual data points>",
      "resume_optimization": {
        "strengths_to_highlight": ["<actual strengths from CV that match job>"],
        "keywords_to_add": ["<actual keywords from job missing in CV>"],
        "sections_to_improve": {
          "summary": "<specific advice based on actual CV summary>",
          "experience": "<specific advice based on actual CV experience>",
          "skills": "<specific advice based on actual CV skills>"
        },
        "phrases_to_include": ["<actual phrases from job description>"],
        "formatting_suggestions": ["<specific improvements for actual CV format>"],
        "ats_optimization": ["<actual keywords from job posting for ATS>"]
      }
    }
    
    VALIDATION:
    - Every skill in matching_skills MUST exist in both candidate_cv_data.skills AND scraped_job_details.required_skills
    - Every skill in missing_skills MUST exist in scraped_job_details.required_skills but NOT in candidate_cv_data.skills
    - All advice MUST reference actual content from the provided data
    
  context:
    - job_extraction_task
  input:
    - candidate_cv_data
    - scraped_job_details